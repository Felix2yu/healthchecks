{% if num_lists %}
<p class="alert alert-success">认证成功！</p>
<p>请选择要发布通知到的 Trello 列表：</p>

<form method="post" class="form-horizontal">
    {% csrf_token %}
    <input type="hidden" name="token" value="{{ token }}" />
    <input id="board-name" type="hidden" name="board_name" value="" />
    <input id="list-name" type="hidden" name="list_name" value="" />
    <input id="list-id" type="hidden" name="list_id" value="" />

    <div class="form-group {{ form.value.css_classes }}">
        <label for="list-selector" class="col-sm-3 control-label">发布通知到</label>
        <div class="col-sm-3">
            <select id="list-selector" name="board_list_id" class="form-control">
            {% for board in boards %}
                <optgroup label="{{ board.name }}">
                    {% for list in board.lists %}
                        <option
                            data-list-id="{{ list.id }}"
                            data-board-name="{{ board.name }}"
                            data-list-name="{{ list.name}}"
                            value="{{ board.id }},{{ list.id}}">{{ list.name }}</option>
                    {% endfor %}
                </optgroup>
            {% endfor %}
            </select>

            {% if form.board_list_id.errors %}
            <div class="help-block">
                {{ form.board_list_id.errors|join:"" }}
            </div>
            {% endif %}
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-3 col-sm-9">
            <button type="submit" class="btn btn-primary">保存集成</button>
        </div>
    </div>
</form>
{% elif error %}
<p class="alert alert-warning">
    无法从你的 Trello 账户获取数据。
    收到来自 Trello 的意外响应。
</p>
{% else %}
<p class="alert alert-warning">
    在你的 Trello 账户中未找到任何包含列表的看板。
    你是否登录了正确的 Trello 账户？
</p>
{% endif %}
