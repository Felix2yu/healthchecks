{% load hc_extras %}
{% if events %}
<table
    class="table"
    id="log"
    data-url="{% url 'hc-ping-details' check.code '0' %}">{% for event in events %}{% include "front/log_row.html" %}{% endfor %}</table>
<p class="text-center"><a href="{% url 'hc-log' check.code %}">显示更多&hellip;</a></p>
{% else %}
    <div class="alert no-events">
        您将在此看到<span class="hidden-xs">实时更新</span>的已接收 Ping 日志。<br />
        此检查项尚未收到任何 Ping。
    </div>
{% endif %}
