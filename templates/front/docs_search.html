<ul class="docs-nav">
    <li class="nav-header">搜索结果</li>
    {% if results %}
        {% for slug, title, snippet in results %}
        <li>
            <a href="{% url 'hc-serve-doc' slug %}">{{ title|safe }}</a>
            <p>{{ snippet|safe }}</p>
        </li>
        {% endfor %}
        </ul>
    {% else %}
        <li>您的搜索查询没有匹配到结果。</li>
    {% endif %}
</ul>
