{% extends "base.html" %}
{% load compress static hc_extras %}

{% block content %}
<div class="row">
    <div class="col-sm-12">
        <h1>Signal CAPTCHA</h1>

        {% if result %}
        <p>结果：</p>
        <pre>{{ result }}</pre>
        <hr />
        {% endif %}

        <p>
            首先，<a href="https://signalcaptchas.org/challenge/generate.html" target="_blank">在此处</a>
            解决 CAPTCHA，然后将其粘贴到下方：
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="challenge">挑战</label>
                <input
                    id="challenge"
                    name="challenge"
                    required
                    class="form-control"
                    value="{{ challenge }}" />
            </div>

            <div class="form-group">
                <label for="captcha">CAPTCHA</label>
                <textarea
                    id="captcha"
                    name="captcha"
                    required
                    class="form-control"
                    rows="10"></textarea>
            </div>
                <button type="submit" class="btn btn-primary btn-lg pull-right">提交</button>
        </form>
    </div>
</div>
{% endblock %}
