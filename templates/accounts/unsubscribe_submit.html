{% extends "base_bare.html" %}

{% block title %}取消订阅{% endblock %}

{% block content %}
<p>请点击下方按钮取消订阅：</p>
<br />
<form id="form" method="post">
    <input
        id="submit-btn"
        type="submit"
        class="btn btn-lg btn-primary"
        value="取消订阅">
</form>

{% if autosubmit %}
	<script>document.getElementById("form").submit();</script>
{% endif %}

{% endblock %}
